# Roda em todo PR e em push no main: valida os contratos e roda os testes (sem rede).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Contratos (exemplos batem com os schemas)
        run: python contracts/validate.py
      - name: Testes
        run: |
          if [ -d tests ]; then python -m pytest -q; else echo "sem testes neste branch"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenSpec (changes e specs bem formados)
        env:
          DO_NOT_TRACK: "1"   # desliga a telemetria do CLI
        run: npx -y @fission-ai/openspec@2.1.1 validate --all --strict
