# Job diário: coleta as issues, grava os desfechos, pergunta ao Jev sobre as abertas e
# commita tudo no branch `data`. Idempotente: rodar de novo (ou pular um dia) não duplica nada,
# porque cada passo só acrescenta o que falta e o cursor da coleta só avança quando dá certo.
name: Job diário

on:
  schedule:
    - cron: "0 9 * * *"   # 06:00 em Brasília; o Actions pode atrasar ou pular
  workflow_dispatch:
    inputs:
      max_jev:
        description: "Teto de issues avaliadas pelo Jev por repositório"
        default: "200"

permissions:
  contents: write   # commit no branch data

concurrency:
  group: job-diario
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      DATA_DIR: dados/data
    steps:
      - uses: actions/checkout@v4
      - name: Branch data
        uses: actions/checkout@v4
        with:
          ref: data
          path: dados
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Coleta
        run: python -m collector --data-dir "$DATA_DIR"
      - name: Desfechos
        run: python -m outcomes --data-dir "$DATA_DIR"
      - name: Jev (abertas)
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::TYPESAFE_API_KEY não configurada nos secrets; passo do Jev pulado."
            exit 0
          fi
          python -m evaluator --mode daily --data-dir "$DATA_DIR" --max "${{ inputs.max_jev || '200' }}"

      # Os arquivos são gravados de forma atômica e validados, então o que um passo concluiu
      # pode ser commitado mesmo se um passo seguinte falhar (o job continua marcado como falho).
      - name: Commit no branch data
        if: always()
        working-directory: dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git commit -q -m "Job diário $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data
