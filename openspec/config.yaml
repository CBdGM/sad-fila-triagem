schema: spec-driven

context: |
  Language: pt-BR
  All artifacts must be written in pt-BR.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projeto: SAD v3, fila de triagem de issues do GitHub com o Jev (IF1006, CIn-UFPE).
  Arquitetura: job diário no GitHub Actions, só leitura sobre repositórios públicos; o Jev responde
  perguntas tipadas; um calibrador (regressão logística) treinado nas issues fechadas dá P(sem ação);
  um site estático lê public/queue.json. Sem banco nem servidor: dados em JSONL no branch data.
  Equipes: Back (dados, Jev, calibrador, avaliação), Integração (coleta, job, arquivos), Front (site).
  Contratos de dados ficam em contracts/ como JSON Schema; specs descrevem comportamento e apontam
  para eles. Mudança incompatível de contrato exige nova schema_version.
  Nunca colocar chaves no código; segredos só em .env (ignorado) ou nos secrets do Actions.
githubCopilot:
  cloudAgent: false

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
